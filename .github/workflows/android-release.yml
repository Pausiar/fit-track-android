name: Android signed release

# Publica una versión cuando se empuja un tag vX.Y.Z.
# Secretos necesarios:
#   FIT_KEYSTORE_BASE64, FIT_KEYSTORE_PASSWORD, FIT_KEY_ALIAS, FIT_KEY_PASSWORD
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 34 components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto FIT_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          test -s keystore/release.jks

      - name: Build signed release APK
        env:
          FIT_KEYSTORE_FILE: keystore/release.jks
          FIT_KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
          FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
          FIT_KEY_PASSWORD: ${{ secrets.FIT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature and version
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -1
          VERSION="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          CODE="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con versionName $VERSION"
            exit 1
          fi
          CERT_HEX="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          if [ -z "$CERT_HEX" ]; then
            echo "::error::No se ha podido leer la huella SHA-256 del certificado de firma"
            exit 1
          fi
          CERT="$(printf '%s' "$CERT_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          {
            echo "version=$VERSION"
            echo "version_code=$CODE"
            echo "cert_sha256=$CERT"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fit-track-${{ env.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "fit-track-$version.apk"
          sha256sum "fit-track-$version.apk" > "fit-track-$version.apk.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "fit-track-$version.apk" \
              "fit-track-$version.apk.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "fit-track-$version.apk" \
              "fit-track-$version.apk.sha256" \
              --title "Fit Track $version" \
              --generate-notes
          fi

      - name: Publish download metadata to main
        env:
          GH_TOKEN: ${{ github.token }}
          FIT_KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
          FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          WORKTREE="$RUNNER_TEMP/fit-track-main"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" origin/main
          cd "$WORKTREE"
          # La huella publicada debe ser la del certificado que firma este APK:
          # si se rota la clave, el valor anterior de release.json queda obsoleto.
          "$JAVA_HOME/bin/keytool" -exportcert -rfc \
            -keystore "$GITHUB_WORKSPACE/keystore/release.jks" \
            -alias "$FIT_KEY_ALIAS" \
            -storepass:env FIT_KEYSTORE_PASSWORD \
            -file docs/fit-track-release.pem
          python3 scripts/update_release.py \
            --apk "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" \
            --version "$version" \
            --version-code "$version_code" \
            --published-at "$(date -u +%F)" \
            --cert-sha256 "$cert_sha256" \
            --update-html
          python3 scripts/check-site.py
          git add docs
          if git diff --cached --quiet; then
            echo "La web ya estaba actualizada."
          else
            git commit -m "chore: publish Fit Track $version"
            git push origin HEAD:main
          fi
          # No desplegamos Pages desde aquí: deploy-pages solo acepta refs de main,
          # no de un tag. Pages construye la rama main por su cuenta (Sources:
          # main /), así que el push de arriba ya publica la web. pages.yml se
          # limita a validar main porque un push con GITHUB_TOKEN no dispara «on: push».

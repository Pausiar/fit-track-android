name: Validate GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site and APK metadata
        run: python3 scripts/check-site.py

      # Pages se publica con el build legacy de la rama main (Sources: main /),
      # así que la web ya está en línea cuando este job termina. Un fallo aquí
      # señala que main publica algo roto: hay que corregirlo con un push nuevo,
      # no revierte el sitio.
